services:
  transcriber:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./input:/app/input
      - ./output:/app/output
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    container_name: voice-to-text-transcriber
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # CLI service untuk batch processing (jalankan manual)
  transcriber-cli:
    build: .
    volumes:
      - ./input:/app/input
      - ./output:/app/output
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    command: python cli_transcribe.py input/audio.mp3 --formats text,json
    restart: "no"
    profiles:
      - cli
