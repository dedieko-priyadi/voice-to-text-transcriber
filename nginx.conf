# Nginx reverse proxy — subpath deployment ke Streamlit
# Akses: http://host:8510/voice-to-text/
#
# Cara pakai:
#   docker compose --profile nginx up -d
#
# Pola: nginx pass-through (tanpa strip prefix), Streamlit handle baseUrlPath sendiri.
# Semua request ke /voice-to-text/* diteruskan utuh ke Streamlit.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # Redirect tanpa trailing slash
    location = /voice-to-text {
        return 301 /voice-to-text/;
    }

    # Semua request subpath — pass-through ke Streamlit (tidak di-rewrite)
    # Streamlit dengan --server.baseUrlPath=/voice-to-text akan handle routing sendiri
    location /voice-to-text/ {
        proxy_pass http://transcriber:8501;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /voice-to-text;

        # Streamlit WebSocket long-polling
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # Health check — Streamlit dengan baseUrlPath serve di /voice-to-text/_stcore/health
    location /health {
        proxy_pass http://transcriber:8501/voice-to-text/_stcore/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
